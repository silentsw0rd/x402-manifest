name: Publish x402-client to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
  environment:
      name: pypi
      url: https://pypi.org/p/x402-extraction-client-44mk1
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install build

      - name: Build package
        run: |
          cd sdk/python
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.3
        with:
          packages-dir: sdk/python/dist/