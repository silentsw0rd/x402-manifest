[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-extraction-client"  # or x402-agent-client / x402-py-client
version = "0.1.0"
description = "Autonomous HTTP 402 payment and EIP-712 signature client for AI agent data extraction."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.28.0",
    "eth-account>=0.11.0"
]

[project.urls]
Homepage = "https://github.com/silentsw0rd/x402-manifest"